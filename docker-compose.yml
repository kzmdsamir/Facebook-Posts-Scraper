# docker-compose.yml — Facebook Posts Scraper
#
# Two services: `backend` (FastAPI :8000) and `frontend` (Next.js :3000),
# both built from the single ./Dockerfile via its `backend` / `frontend`
# targets. An optional PostgreSQL service is provided commented out below.
#
# Quick start:
#   docker compose up --build
#   -> dashboard http://localhost:3000   API http://localhost:8000/api
#      Swagger UI http://localhost:8000/docs
#
# Env vars:
#   Every value below has a working default, so the stack runs with no .env
#   file at all. Create a .env (copy .env.example) if you want to override —
#   docker compose reads it automatically for the ${VAR:-default} references.

name: fb-posts-scraper

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: fb-posts-scraper-backend:latest
    container_name: fb-posts-scraper-backend
    ports:
      - "8000:8000"
    environment:
      # Storage: SQLite by default. Switch to Postgres by uncommenting the
      # `db` service below and setting:
      #   DATABASE_URL: postgresql+psycopg://fb_scraper:change-me@db:5432/fb_scraper
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/facebook_scraper.db}
      DATA_DIR: ${DATA_DIR:-./data}
      EXPORT_BASE_DIR: ${EXPORT_BASE_DIR:-./data/exports}
      WORKER_THREADS: ${WORKER_THREADS:-4}
      MAX_URLS_PER_JOB: ${MAX_URLS_PER_JOB:-100}
      CANCEL_WAIT_SECONDS: ${CANCEL_WAIT_SECONDS:-5.0}
      DEBUG: ${DEBUG:-false}
      # JSON array — the browser origins allowed to call the API directly.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      # Scraper / compliance knobs (see COMPLIANCE.md). Raise
      # SCRAPER_DELAY_SECONDS to throttle harder; never lower it below 1.0 in
      # production use.
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-2.5}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-20}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}
      SCRAPER_ROBOTS: ${SCRAPER_ROBOTS:-1}
    volumes:
      # SQLite database + export files live on the host.
      - ./data:/app/data
    healthcheck:
      # python:3.13-slim has no curl/wget; urllib is guaranteed present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Build-time only: Next.js inlines NEXT_PUBLIC_* into the JS bundle.
        # It must be reachable FROM THE BROWSER (http://localhost:8000 works
        # for local use; use the host's public name when deployed). Do NOT
        # use http://backend:8000 here unless you proxy it — browsers cannot
        # resolve the compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: fb-posts-scraper-frontend:latest
    container_name: fb-posts-scraper-frontend
    ports:
      - "3000:3000"
    environment:
      # Documented for clarity; has no effect at runtime (baked at build).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Optional PostgreSQL 16 (uncomment + set DATABASE_URL above).
  # The backend works unchanged on Postgres — all models use portable
  # SQLAlchemy types. You must also uncomment `psycopg[binary]` in
  # backend/requirements.txt (it is pinned there, just commented out).
  # ------------------------------------------------------------------
  # db:
  #   image: postgres:16-alpine
  #   container_name: fb-posts-scraper-db
  #   environment:
  #     POSTGRES_USER: fb_scraper
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: fb_scraper
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U fb_scraper -d fb_scraper"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

