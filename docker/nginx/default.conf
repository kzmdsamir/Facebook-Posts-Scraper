# postharvest — nginx server block (production profile).
#
#   /        -> frontend (:3000 Next.js standalone)
#   /api/*   -> backend   (:8000 FastAPI; already carries the /api prefix)
#   /docs    -> backend Swagger (open in dev; tighten before public launch)
#
# TLS: terminate here with Let's Encrypt (certbot) when postharvest.space
# points at this VPS. Serve certs from the certbot-conf volume; the *.conf for
# that lives in this dir (tls.conf) or wire it via certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name postharvest.space www.postharvest.space _;

    # HSTS only after TLS is active (certbot will manage the redirects).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- API (backend) ---------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Full path aliases that live under /api (health/docs) without a trailing
    # slash — handled by the /api/ block above via the location match; keep
    # /docs pointing to swagger only in non-prod.
    location = /docs {
        proxy_pass http://backend:8000/docs;
    }

    # ---- Frontend (Next.js) ----------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}