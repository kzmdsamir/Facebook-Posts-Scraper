# nginx main config for the postharvest proxy container.
# Shipped to /etc/nginx/nginx.conf by docker-compose (nginx profile = prod only).
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Non-root must bind to high ports in some setups; we keep 80 as the
    # container user 'nginx' is allowed to bind it. Adjust if hardened.
    include /etc/nginx/conf.d/*.conf;
}